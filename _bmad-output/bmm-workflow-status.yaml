# Workflow Status Template

# This tracks progress through BMM methodology Analysis, Planning, and Solutioning phases.
# Implementation phase is tracked separately in sprint-status.yaml

# STATUS DEFINITIONS:
# ==================
# Initial Status (before completion):
#   - required: Must be completed to progress
#   - optional: Can be completed but not required
#   - recommended: Strongly suggested but not required
#   - conditional: Required only if certain conditions met (e.g., if_has_ui)
#
# Completion Status:
#   - {file-path}: File created/found (e.g., "docs/product-brief.md")
#   - skipped: Optional/conditional workflow that was skipped

generated: "2025-12-25"
project: "mastra-weather-agent"
project_type: "Mastra AI Agent Demo"
selected_track: "bmad-method"
field_type: "greenfield"
workflow_path: "method-greenfield.yaml"

workflow_status:
  # Phase 0: Discovery (Optional)
  - phase: 0
    name: "Discovery"
    workflows:
      - id: "product-brief"
        status: "docs/context/product_brief.md"
        agent: "analyst"
        command: "create-product-brief"
        note: "Pre-existing - found during init"

      - id: "brainstorm"
        status: "_bmad-output/analysis/brainstorming-session-2025-12-25.md"
        agent: "analyst"
        command: "brainstorming"
        note: "Completed - Decision Tree Mapping technique"

  # Phase 1: Planning
  - phase: 1
    name: "Planning"
    workflows:
      - id: "prd"
        status: "required"
        agent: "pm"
        command: "create-prd"
        output: "Product Requirements Document with FRs and NFRs"

      - id: "create-ux-design"
        status: "conditional"
        condition: "if_has_ui"
        agent: "ux-designer"
        command: "create-ux-design"
        note: "Determined after PRD - user/agent decides if needed"

  # Phase 2: Solutioning
  - phase: 2
    name: "Solutioning"
    workflows:
      - id: "create-architecture"
        status: "required"
        agent: "architect"
        command: "create-architecture"
        output: "System architecture document"

      - id: "create-epics-and-stories"
        status: "required"
        agent: "pm"
        command: "create-epics-and-stories"
        note: "Break down PRD into implementable epics and stories"

      - id: "test-design"
        status: "recommended"
        agent: "tea"
        command: "testarch-test-design"
        output: "System-level testability review"

      - id: "implementation-readiness"
        status: "required"
        agent: "architect"
        command: "check-implementation-readiness"
        note: "Validates PRD + Architecture + Epics + UX"

  # Phase 3: Implementation
  - phase: 3
    name: "Implementation"
    workflows:
      - id: "sprint-planning"
        status: "required"
        agent: "sm"
        command: "sprint-planning"
        note: "Creates sprint plan - subsequent work tracked in sprint-status.yaml"
